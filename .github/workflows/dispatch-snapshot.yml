name: Dispatch Snapshot

# Fetches every dispatch feed and commits the result as a static file the
# pages can read from their own origin. CORS binds browsers and not runners,
# so this moves the fetching to where it is permitted.
#
# Every 6 hours rather than hourly, because each commit triggers a Cloudflare
# Pages build and the free plan allows 500 a month. Six-hourly costs ~124 and
# leaves room for ordinary commits; hourly would cost 720 and break the site's
# deploys for the rest of the month.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dispatch-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Fetch the feeds
        run: node .github/scripts/build-dispatch-snapshot.js

      - name: Commit if anything changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-dispatch.json music-dispatch.json evolution-dispatch.json
          # Headlines change on their own schedule, and a commit per run whether
          # or not anything moved would be noise in the history and a wasted
          # Pages build each time.
          if git diff --cached --quiet; then
            echo "no change in the feeds; nothing to commit"
            exit 0
          fi
          git commit -m "Dispatch snapshot: refresh the feeds

          Generated by .github/workflows/dispatch-snapshot.yml."
          git push origin HEAD:main

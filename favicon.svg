<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Methodic Truth sigil: the triple moon — waxing, full, waning — a thing
       seen in phases. Drawn as an engraved astrolabe plate: aged ivory on
       deep night, a double ring with compass ticks, a hairline etch around
       each moon, a dim mist behind the full one, and a fine grain over all. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#1a1d33"/>
      <stop offset="0.7" stop-color="#0a0c1a"/>
      <stop offset="1" stop-color="#040510"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd6dc" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#4fa9b4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4fa9b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6cc"/>
      <stop offset="0.55" stop-color="#e3d4b0"/>
      <stop offset="1" stop-color="#c9b78f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d8b8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9c8b64" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.7  0 0 0 0.16 0"/>
    </filter>
    <clipPath id="disc"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>
  <!-- outer and inner rings, the plate -->
  <circle cx="32" cy="32" r="29.6" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26.2" fill="none" stroke="#cdbc93" stroke-opacity="0.28" stroke-width="0.6"/>
  <!-- compass ticks between the rings, eight of them -->
  <g stroke="#e0d2ad" stroke-opacity="0.7" stroke-width="0.8" stroke-linecap="round">
    <line x1="32" y1="3.4" x2="32" y2="6.6"/>
    <line x1="32" y1="57.4" x2="32" y2="60.6"/>
    <line x1="3.4" y1="32" x2="6.6" y2="32"/>
    <line x1="57.4" y1="32" x2="60.6" y2="32"/>
    <line x1="11.8" y1="11.8" x2="14" y2="14"/>
    <line x1="52.2" y1="11.8" x2="50" y2="14"/>
    <line x1="11.8" y1="52.2" x2="14" y2="50"/>
    <line x1="52.2" y1="52.2" x2="50" y2="50"/>
  </g>
  <circle cx="32" cy="32" r="16" fill="url(#mist)"/>
  <!-- the moons, aged ivory with a hairline etch -->
  <g fill="url(#ivory)" stroke="#3a2e1c" stroke-opacity="0.55" stroke-width="0.6">
    <path d="M21.5 17.5 A14.5 14.5 0 0 0 21.5 46.5 A20.5 20.5 0 0 1 21.5 17.5 Z"/>
    <circle cx="32" cy="32" r="7.8"/>
    <path d="M42.5 17.5 A14.5 14.5 0 0 1 42.5 46.5 A20.5 20.5 0 0 0 42.5 17.5 Z"/>
  </g>
  <!-- a gleam on the full moon, the eye's catchlight -->
  <circle cx="29.6" cy="29.4" r="1.6" fill="#fff8e8" fill-opacity="0.85"/>
  <!-- grain over everything, clipped to the disc -->
  <rect width="64" height="64" filter="url(#grain)" clip-path="url(#disc)" opacity="0.9"/>
</svg>
